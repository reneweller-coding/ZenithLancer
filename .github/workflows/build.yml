# Zenith Lancer: every push and pull request built for Windows and Linux with the presets of CMakePresets.json, and
# the headless tests run (ctest -R "data|missions": every data file, every mission flown to its end by the
# autopilot). The app tests play the screens in a window and stay with the local builds (build.ps1 -Test). Nothing is
# packed; tags are release.yml's.
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (msvc preset, Visual Studio 18 2026)
        run: cmake --preset msvc

      - name: Build (Release)
        run: cmake --build --preset msvc --parallel

      - name: Headless tests
        run: ctest --preset msvc -R "data|missions"

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: The compiler and the headers GLFW needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Configure (linux preset, GCC 12, Release)
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux --parallel

      - name: Headless tests
        run: ctest --preset linux -R "data|missions"
